<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;min-height:100vh}

main{padding:20px 16px 110px;max-width:980px;width:100%;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}p.s{color:var(--mute);font-size:13px;margin:0 0 16px}
.card{background:var(--card);border-radius:28px;padding:18px;box-shadow:0 8px 28px #2b2d5b1a;margin-bottom:16px}
.grid{display:grid;gap:16px}
.btn{border:0;border-radius:999px;background:var(--pri);color:var(--onpri);font:600 14px var(--ff);padding:12px 22px;min-height:44px;cursor:pointer}
.btn.g{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{border:2px solid transparent;background:var(--bg1);border-radius:20px;padding:8px;cursor:pointer;text-align:center;font:600 12px var(--ff);color:var(--ink)}
.opt.on{border-color:var(--pri)}
svg{width:100%;height:auto;display:block}
.room{cursor:pointer}
input[type=number],input[type=text]{font:500 18px var(--ff);width:100%;padding:10px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-height:48px}
.step{display:flex;align-items:center;gap:6px}.step button{width:44px;height:44px;border-radius:50%;border:0;background:var(--acc);color:#2b2d5b;font-size:22px;cursor:pointer}
.chip{border:0;border-radius:999px;padding:8px 14px;background:var(--bg1);color:var(--ink);font:500 12px var(--ff);cursor:pointer;min-height:40px}
.chip.on{background:var(--pri);color:var(--onpri)}
.st{display:inline-block;border-radius:999px;padding:4px 10px;font:600 12px var(--ff)}
.st.ok{background:var(--ok);color:var(--okt)}.st.warn{background:var(--warn);color:var(--warnt)}.st.bad{background:var(--bad);color:var(--badt)}.st.na{background:var(--line);color:var(--mute)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.li small{color:var(--mute);display:block}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
pre{white-space:pre-wrap;background:var(--bg1);border-radius:16px;padding:14px;font-size:12px;overflow-x:auto}

.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.top .logo{display:block;font:700 20px var(--ff);padding:0;margin-right:auto}
.hint{background:var(--bg1);border-radius:20px;padding:14px;font-size:13px;color:var(--mute)}
.big{font:600 15px var(--ff)}
@media(min-width:900px){main{max-width:1100px}.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}.sticky{position:sticky;top:16px}}
.plan{overflow:auto;border-radius:20px;background:#fff}.plan svg{min-width:720px}
details{margin:6px 0 14px;font-size:13px;color:var(--mute)}details input{font-size:15px;min-height:40px}

/* ===== Dashboard style (sage green) ===== */
:root{--page:#f2f2ef;--shell:#e8e7e0;--bg1:#f3f2ec;--bg2:#f3f2ec;--card:#fff;--ink:#121614;--mute:#59615b;--pri:#121614;--onpri:#fff;--acc:#dfe9e1;--ok:#e3efe6;--okt:#3c7a50;--warn:#f6ecc9;--warnt:#85650f;--bad:#fbe2e0;--badt:#c0392f;--line:#ecebe5;--g1:#86a58f;--g2:#4f6f5a;--ff:"Plus Jakarta Sans",Inter,system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0e1210;--shell:#161c19;--bg1:#202823;--bg2:#202823;--card:#1f2723;--ink:#eef2ee;--mute:#93a198;--pri:#e9f0ea;--onpri:#14201a;--acc:#2b372f;--ok:#243d2d;--okt:#bfe5cb;--warn:#4a3f17;--warnt:#f3df9a;--bad:#4a2523;--badt:#ffc9c4;--line:#2b3530;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0e1210;--shell:#161c19;--bg1:#202823;--bg2:#202823;--card:#1f2723;--ink:#eef2ee;--mute:#93a198;--pri:#e9f0ea;--onpri:#14201a;--acc:#2b372f;--ok:#243d2d;--okt:#bfe5cb;--warn:#4a3f17;--warnt:#f3df9a;--bad:#4a2523;--badt:#ffc9c4;--line:#2b3530;color-scheme:dark}
body{font-family:var(--ff);background:var(--page);color:var(--ink)}
button,input,select{font-family:var(--ff)}
.shell{max-width:1360px;margin:12px auto;padding:16px;background:var(--shell);border-radius:28px}
main{padding:0 0 96px;max-width:none}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:none;margin-bottom:16px}
h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:4px 0}h2{font-size:16px;font-weight:700}p.s{color:var(--mute)}
.btn{background:linear-gradient(180deg,var(--g1),var(--g2));color:#fff;border-radius:10px;padding:11px 20px;font:600 13px var(--ff);box-shadow:none}
.btn.g{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.chip{background:var(--card);color:var(--ink);font:600 12px var(--ff);border-radius:999px}.chip.on{background:var(--pri);color:var(--onpri)}
input[type=number],input[type=text]{border:0;background:var(--bg1);border-radius:14px}
.step button{background:var(--bg1);color:var(--ink)}
.bar{background:var(--line)}.bar i{background:linear-gradient(90deg,var(--g1),var(--g2))}
.opt{background:var(--bg1);border-radius:18px}.hint{background:var(--bg1);border-radius:16px}.st.na{background:var(--bg1);color:var(--mute)}.plan,#mapbox{background:#fff}
.hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:4px 4px 22px}
.hl{display:flex;align-items:center;gap:16px;margin-right:auto}.lg,.lg svg{width:48px;height:48px;display:block;flex:none}
.hi{font-size:20px;font-weight:800;letter-spacing:-.02em}.hs{font-size:13px;color:var(--ink);margin-top:3px}
.srch{display:flex;align-items:center;background:var(--card);border-radius:999px;padding:5px 5px 5px 20px;width:min(100%,320px)}
.srch input{background:transparent;min-height:38px;padding:0;font-size:13px;font-weight:500}.srch input:focus{outline:0}
.sbtn,.rbtn{flex:none;width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer}
.sbtn{background:#121614;color:#fff}.rbtn{background:var(--card);color:var(--ink)}
.qm{font-size:12px;color:var(--badt);width:100%;text-align:right;min-height:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0 16px}
.stats .card{margin:0;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:76px}
.sc small{display:block;font-size:12px;color:var(--mute);font-weight:500}.sc b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sc .vz{width:64px;height:34px;flex:none}.sc .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:var(--okt);flex:none;font-style:normal}
.sc .ic.y{background:var(--warn);color:var(--warnt)}.sc .ic.n{background:var(--bg1);color:var(--mute)}
.stats .sc.hl{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}.stats .sc.hl small{color:#ffffffcc}
.dash{display:grid;gap:16px}.dash>*{min-width:0}
#mapin svg .un{transition:fill .3s ease,fill-opacity .3s ease,stroke-width .15s ease}#mapin svg rect.un:hover{stroke:#121614;stroke-width:1.4}#mapbox:active{cursor:grabbing}
.badge{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--ff)}.badge i{width:9px;height:9px;border-radius:50%;background:var(--g2)}
.gauge{width:100%;max-width:230px;margin:6px auto 0}.gauge .v{font:800 28px var(--ff);fill:var(--ink)}
.pf{text-align:center}.pf .av2{width:56px;height:56px;border-radius:50%;background:var(--acc);display:grid;place-items:center;margin:0 auto 8px}
.pf .av2 svg{width:34px;height:34px}.pf b{font-size:16px;font-weight:800;display:block}.pf small{color:var(--mute)}
.pf .tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px}.pf .tri small{display:block;font-size:11px}.pf .tri b{font-size:20px}
#side{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--card);border-radius:999px;box-shadow:0 10px 30px #00000026}
.sb{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--mute);display:grid;place-items:center;cursor:pointer;flex:none}
.sb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb.on{background:#121614;color:#fff}.sb:disabled{opacity:.3;cursor:not-allowed}#side .sp,#side .av{display:none}
@media(min-width:900px){
.shell{display:grid;grid-template-columns:76px minmax(0,1fr);gap:28px;margin:24px auto;padding:30px;border-radius:30px}
#side{position:sticky;transform:none;left:auto;bottom:auto;top:30px;height:min(calc(100vh - 100px),760px);flex-direction:column;padding:16px 12px;gap:10px;border-radius:999px;box-shadow:none;align-self:start}
#side .sp{display:block;flex:1}#side .av{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#121614;color:#fff;font:700 12px var(--ff)}
main{padding:0 0 24px}.stats{grid-template-columns:repeat(4,1fr)}.dash{grid-template-columns:minmax(0,1fr) 290px;align-items:start}}
#mapbox{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:contain}

/* ===== Sinkron Google Sheet (aktif hanya di Apps Script; di luar itu tetap lokal) ===== */
const GS=(typeof google!=='undefined'&&google.script&&google.script.run)?google.script.run:null;
const cl=o=>JSON.parse(JSON.stringify(o));
let SNAP={act:{},pl:{},custom:'[]',tol:20},SY=0,BUSY=0,READY=0;
function sync(t){let e=$('#sync');if(!e){e=document.createElement('div');e.id='sync';e.setAttribute('role','status');e.style.cssText='position:fixed;left:12px;top:6px;z-index:20;font:600 11px var(--ff);color:var(--mute)';document.body.appendChild(e)}e.textContent=t}
const snapOf=r=>({act:cl(r.act||{}),pl:cl(r.pl||{}),custom:JSON.stringify(r.custom||[]),tol:r.tol||20});
function adopt(r,base,force){let ch=0;['act','pl'].forEach(m=>Object.keys(r[m]||{}).forEach(k=>{if((force||st[m][k]===base[m][k])&&st[m][k]!==r[m][k]){st[m][k]=r[m][k];ch=1}}));
(r.custom||[]).forEach(c=>{if(!UNITS.some(x=>x[0]===c[0])){CUSTOM.push(c);UNITS.push(c);ch=1}});if(ch){saveC();savePl()}
if(force&&r.tol&&r.tol!==st.tol){st.tol=r.tol;ch=1}return ch}
function diff(){const d={act:{},pl:{},del:[],n:0};['act','pl'].forEach(m=>{Object.keys(st[m]).forEach(k=>{if(SNAP[m][k]!==st[m][k]){d[m][k]=st[m][k];d.n++}});Object.keys(SNAP[m]).forEach(k=>{if(!(k in st[m])){d.del.push(m+'|'+k);d.n++}})});
if(JSON.stringify(CUSTOM)!==SNAP.custom){d.custom=CUSTOM;d.n++}if(st.tol!==SNAP.tol){d.tol=st.tol;d.n++}return d}
function schedSync(){if(!GS||!READY)return;clearTimeout(SY);SY=setTimeout(push,1500)}
function push(){if(BUSY){schedSync();return}const d=diff();if(!d.n){sync('Tersinkron ✔');return}
BUSY=1;sync('Menyimpan…');const sent={act:cl(st.act),pl:cl(st.pl)};
GS.withSuccessHandler(r=>{BUSY=0;const ch=adopt(r,sent,0);SNAP=snapOf(r);sync('Tersimpan ✔ '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}));if(ch)render()})
.withFailureHandler(e=>{BUSY=0;sync('Belum tersinkron (data aman di perangkat)');clearTimeout(SY);SY=setTimeout(push,15000)}).saveRuangCekData(d)}
function pull(force){if(!GS)return;sync('Memuat…');GS.withSuccessHandler(r=>{const ch=adopt(r,SNAP,force);SNAP=snapOf(r);READY=1;sync('Tersinkron ✔');if(ch||force)render();else schedSync()})
.withFailureHandler(e=>{READY=1;sync('Offline – memakai data perangkat');schedSync()}).getRuangCekData()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&GS&&READY&&!BUSY)pull(0)});
if(GS)pull(1);
